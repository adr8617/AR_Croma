<!-- Reemplaza temporalmente tu pantalla de inicio por esto -->
<div id="pantalla-inicio" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: red; z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;">
    <h1 style="color: white;">PRUEBA DE AISLAMIENTO</h1>
    <button id="btn-prueba-aislada" style="padding: 20px 40px; font-size: 20px; background: yellow; color: black; font-weight: bold; border: none; cursor: pointer;">
        TÓCAME (PRUEBA)
    </button>
    <p id="texto-resultado" style="color: white; font-size: 18px; font-weight: bold;"></p>
</div>

<script>
const btnPrueba = document.getElementById('btn-prueba-aislada');
const textoResultado = document.getElementById('texto-resultado');
const pantallaInicio = document.getElementById('pantalla-inicio');

// 1. Prueba pura con el evento más básico posible de JavaScript
btnPrueba.addEventListener('click', () => {
    textoResultado.innerText = "¡ÉXITO! El evento click funcionó.";
    pantallaInicio.style.backgroundColor = "green"; // Cambia el fondo a verde si reacciona
});

// 2. Prueba adicional por si el móvil usa eventos táctiles puros
btnPrueba.addEventListener('touchstart', () => {
    textoResultado.innerText = "¡ÉXITO! El evento touchstart funcionó.";
    pantallaInicio.style.backgroundColor = "blue"; // Cambia el fondo a azul si reacciona
}, { passive: true });
</script>
